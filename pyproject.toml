[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "instabreaker"
version = "0.1.0"
description = "A modern Instagram credential testing tool"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "zenzemie" },
]
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "httpx[http2]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
instabreaker = "instabreaker.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/instabreaker"]
